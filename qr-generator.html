<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study QR Generator</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;color:#172b4d}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcccdc;border-radius:8px;font:inherit}button{padding:11px 16px;margin:10px 8px 10px 0;background:#176b87;color:white;border:0;border-radius:8px;font:inherit;font-weight:700}#qr{margin:20px 0}img{max-width:100%}.muted{color:#627d98}</style></head><body><h1>Classroom Air & Cognition — QR Generator</h1><p>Paste the final public HTTPS URL of your participant page. Generate and download the QR code, then test it with a different phone before printing.</p><label for="url">Participant website URL</label><input id="url" placeholder="https://your-site.example/index.html"><button id="make">Generate QR code</button><button id="save" disabled>Download QR PNG</button><p class="muted">Do not use a file:// URL or a local computer path. The site must be deployed first.</p><div id="qr"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
let current=null;document.getElementById('make').onclick=()=>{const v=document.getElementById('url').value.trim();if(!/^https:\/\//i.test(v)){alert('Enter a public HTTPS URL first.');return;}const box=document.getElementById('qr');box.innerHTML='';new QRCode(box,{text:v,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{current=box.querySelector('canvas')?box.querySelector('canvas').toDataURL('image/png'):box.querySelector('img')?.src;document.getElementById('save').disabled=!current;},300);};document.getElementById('save').onclick=()=>{if(!current)return;const a=document.createElement('a');a.href=current;a.download='classroom-air-cognition-qr.png';a.click();};
</script></body></html>
